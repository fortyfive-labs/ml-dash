[project]
name = "ml-dash"
version = "0.6.27"
description = "ML experiment tracking and data storage"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Ge Yang"},
    {name = "Tom Tao"}
]
keywords = ["machine-learning", "experiment-tracking", "mlops", "data-storage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "cryptography>=42.0.0",
    "params-proto>=3.0.0",
]

[project.urls]
Documentation = "https://docs.dash.ml"
Homepage = "https://dash.ml"
Source = "https://github.com/fortyfive-labs/ml-dash"

[project.scripts]
ml-dash = "ml_dash.cli:main"

[project.optional-dependencies]
video = [
    "imageio>=2.31.0",
    "imageio-ffmpeg>=0.4.9",
    "scikit-image>=0.21.0",
]
auth = [
    "keyring>=25.0.0",
    "qrcode>=8.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # test/conftest.py mints a test JWT at import time, so the whole suite
    # fails to collect without this. Test-only — nothing in src/ imports jwt.
    "pyjwt>=2.8.0",
    # test_numpy_serialization.py and test_save_video.py import numpy directly.
    # The `video` extra pulls it in transitively via scikit-image, but the test
    # suite should not depend on that happening to be installed.
    "numpy>=1.24",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
# Scope collection to the SDK's own suite. `examples/` is a separate uv project
# (name = "ml-experiments") with its own testpaths and its own venv; collecting
# its tests from here fails on `import ml_experiments`, which is not installed
# in this environment and should not be.
testpaths = ["test"]

[tool.ruff]
indent-width = 2

[tool.uv]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-timeout>=2.4.0",
]
