# Build, test and publish ml-dash to PyPI.
#
#   push of a vX.Y.Z tag   build + test, then publish to PyPI (Trusted Publishing)
#   pull_request to main   build + test only
#   workflow_dispatch      build + test only — never publishes, whatever ref it runs on
#
# Publishing needs no token: the `publish` job requests a short-lived OIDC token
# (id-token: write) and PyPI exchanges it for an upload credential. PyPI must list
# this repository, this workflow file (release.yml) and the `pypi` environment as
# a trusted publisher for the ml-dash project.
#
# A tag only publishes if it is vX.Y.Z, X.Y.Z equals the version in pyproject.toml,
# and the tagged commit is already on main.

name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag check needs main's history
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false # no cache on a job whose output gets published

      - name: Read package version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pyproject.toml version: $version"

      - name: Check tag matches version and is on main
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::tag $TAG is not vX.Y.Z"; exit 1
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match pyproject.toml version $VERSION"; exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tagged commit $GITHUB_SHA is not on main"; exit 1
          fi

      - name: Build sdist and wheel
        run: uv build --no-sources --out-dir dist

      - name: Smoke-test the installed wheel
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          wheel="dist/ml_dash-${VERSION}-py3-none-any.whl"
          test -f "$wheel" && test -f "dist/ml_dash-${VERSION}.tar.gz"
          uv venv --python 3.12 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python "$wheel"
          if [ -e /tmp/smoke/bin/ml-dash ]; then
            echo "::error::the wheel installed an ml-dash executable"; exit 1
          fi
          cd /tmp
          /tmp/smoke/bin/python - <<'EOF'
          import importlib.metadata as md
          import importlib.util
          import os

          import ml_dash

          dist = md.distribution("ml-dash")
          assert dist.version == os.environ["VERSION"], dist.version
          assert ml_dash.__version__ == dist.version, ml_dash.__version__
          assert not list(dist.entry_points), list(dist.entry_points)
          for mod in ("ml_dash.cli", "ml_dash.cli_commands"):
            assert importlib.util.find_spec(mod) is None, mod
          assert ml_dash.__file__.startswith("/tmp/smoke/"), ml_dash.__file__
          for name in ml_dash.__all__:
            getattr(ml_dash, name)
          print(f"ml-dash {dist.version}: imports, no entry points, no CLI modules")
          EOF

      - name: Run tests
        run: uv run --locked --extra dev --extra video pytest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ml-dash/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing; nothing else
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
